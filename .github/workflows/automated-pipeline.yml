# Purpose: advance cloud state automatically; never occupy a runner while Spark runs.
name: Earthquake automated pipeline

on:
  schedule:
    - cron: '17,47 * * * *'
  push:
    branches: [main, master]
    paths: ['src/**', 'databricks/**', 'config/automation.json', 'requirements*.txt', '.github/workflows/automated-pipeline.yml']
  workflow_dispatch:
    inputs:
      mode:
        description: Tick advances normally; reset erases project data and rebuilds automatically
        type: choice
        options: [tick, reset]
        default: tick
      reset_id:
        description: Reset only; blank uses this GitHub run ID; reuse an ID to resume
        type: string
        default: ''
      confirmation:
        description: Reset only; type RESET_EARTHQUAKE_DEV to erase project data
        type: string
        default: ''

permissions:
  contents: read
concurrency:
  group: earthquake-dev-ingestion
  cancel-in-progress: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'reset') }}

jobs:
  tick:
    if: vars.EQ_AUTOMATION_ENABLED != 'false' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      EQ_ENV: dev
      EQ_VOLUME_ROOT: /Volumes/earthquake_dev/ops/landing
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      EQ_HANDOFF_LEDGER_JOB_ID: ${{ vars.EQ_HANDOFF_LEDGER_JOB_ID }}
      EQ_CAPTURE_LEDGER_JOB_ID: ${{ vars.EQ_CAPTURE_LEDGER_JOB_ID }}
      AIVEN_BOOTSTRAP_SERVERS: ${{ vars.AIVEN_BOOTSTRAP_SERVERS }}
      AIVEN_KAFKA_USERNAME: ${{ secrets.AIVEN_KAFKA_USERNAME }}
      AIVEN_KAFKA_PASSWORD: ${{ secrets.AIVEN_KAFKA_PASSWORD }}
      AIVEN_KAFKA_CA_PEM: ${{ secrets.AIVEN_KAFKA_CA_PEM }}
      EQ_KAFKA_TOPIC: earthquake_events_dev
      REQUEST_MODE: ${{ inputs.mode || 'tick' }}
      RESET_ID: ${{ inputs.reset_id }}
      RESET_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-kafka.txt
      - name: Verify code before cloud mutation
        run: |
          python scripts/check_code.py
          python -m unittest discover -s tests -q
      - name: Advance the durable cloud controller
        run: |
          args=(--mode "$REQUEST_MODE")
          if [ "$REQUEST_MODE" = reset ]; then
            reset_key="$RESET_ID"
            if [ -z "$reset_key" ]; then reset_key="reset-${GITHUB_RUN_ID}"; fi
            args+=(--reset-id "$reset_key" --confirmation "$RESET_CONFIRMATION")
          fi
          python -m quake_pipeline.automation "${args[@]}"
