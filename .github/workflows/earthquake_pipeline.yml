# One bounded hourly capture, Kafka transport, landing, and dispatch cycle.
name: Earthquake Watch

on:
  schedule:
    - cron: '17 * * * *' # Hourly at minute 17 UTC
  workflow_dispatch:

concurrency:
  group: earthquake-dev-pipeline
  cancel-in-progress: false
  queue: max

jobs:
  cycle:
    if: vars.EQ_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install transport dependencies
        run: python -m pip install -e '.[kafka]'

      - name: Verify Databricks job access
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          EQ_DATABRICKS_JOB_ID: ${{ vars.EQ_DATABRICKS_JOB_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          host = os.environ["DATABRICKS_HOST"].strip().rstrip("/")
          token = os.environ["DATABRICKS_TOKEN"].strip()
          job_id = os.environ["EQ_DATABRICKS_JOB_ID"].strip()

          if not host.startswith("https://"):
              raise SystemExit(
                  "DATABRICKS_HOST must be an HTTPS Databricks workspace URL."
              )

          if not token:
              raise SystemExit("DATABRICKS_TOKEN is empty.")

          if not job_id.isdigit():
              raise SystemExit(
                  "EQ_DATABRICKS_JOB_ID must contain only the numeric Job ID."
              )

          url = (
              f"{host}/api/2.2/jobs/get?"
              + urlencode({"job_id": job_id})
          )

          request = Request(
              url,
              method="GET",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
              },
          )

          try:
              with urlopen(request, timeout=25) as response:
                  result = json.load(response)
          except HTTPError as exc:
              response_body = exc.read().decode(
                  "utf-8",
                  errors="replace",
              )

              raise SystemExit(
                  "Databricks job preflight failed. "
                  f"HTTP status: {exc.code}. "
                  f"Response: {response_body}"
              ) from exc

          returned_job_id = str(result.get("job_id", ""))
          job_name = result.get("settings", {}).get(
              "name",
              "unknown",
          )

          if returned_job_id != job_id:
              raise SystemExit(
                  "Databricks returned a different Job ID: "
                  f"{returned_job_id}"
              )

          print(
              json.dumps(
                  {
                      "access": "OK",
                      "job_id": returned_job_id,
                      "job_name": job_name,
                  }
              )
          )
          PY

      - name: Capture, publish, land, and dispatch once
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          AIVEN_BOOTSTRAP_SERVERS: ${{ vars.AIVEN_BOOTSTRAP_SERVERS }}
          AIVEN_KAFKA_USERNAME: ${{ secrets.AIVEN_KAFKA_USERNAME }}
          AIVEN_KAFKA_PASSWORD: ${{ secrets.AIVEN_KAFKA_PASSWORD }}
          AIVEN_KAFKA_CA_PEM: ${{ secrets.AIVEN_KAFKA_CA_PEM }}
          EQ_DATABRICKS_JOB_ID: ${{ vars.EQ_DATABRICKS_JOB_ID }}
          EQ_PROCESSING_REVISION: ${{ vars.EQ_PROCESSING_REVISION }}
        run: earthquake-watch cycle