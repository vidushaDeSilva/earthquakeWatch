# Purpose: invoke snapshots, reviewed retention, isolated replay and explicit rollback in the same Job.
name: Earthquake lifecycle and rollback (Sprint 8)

on:
  workflow_dispatch:
    inputs:
      action:
        description: Begin with snapshot or plan; apply requires an inspected plan ID
        type: choice
        default: plan
        options: [snapshot, plan, apply, rollback, replay, vacuum_preview, vacuum]
      plan_id:
        description: Apply only, exact retention plan ID
        type: string
        default: ''
      target_publication_id:
        description: Rollback only, retained READY publication ID
        type: string
        default: ''
      expected_generation:
        description: Rollback only, current serving pointer generation
        type: string
        default: '0'
      reason:
        description: Rollback only, concise nonsecret reason
        type: string
        default: ''
      replay_id:
        description: Replay only, lowercase name up to 24 characters
        type: string
        default: ''

permissions:
  contents: read
concurrency:
  group: earthquake-dev-ingestion
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: '1'
      EQ_ENV: dev
      EQ_VOLUME_ROOT: ${{ vars.EQ_VOLUME_ROOT }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      EQ_CAPTURE_LEDGER_JOB_ID: ${{ vars.EQ_HANDOFF_LEDGER_JOB_ID }}
      EQ_LEDGER_WAIT_SECONDS: '2400'
      MAINTENANCE_ACTION: ${{ inputs.action }}
      PLAN_ID: ${{ inputs.plan_id }}
      TARGET_ID: ${{ inputs.target_publication_id }}
      EXPECTED_GENERATION: ${{ inputs.expected_generation }}
      ROLLBACK_REASON: ${{ inputs.reason }}
      REPLAY_ID: ${{ inputs.replay_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve documented Job parameters without shell interpolation
        run: |
          python - <<'PY'
          import json, os
          parameters = {'gold_action':'preview', 'reconcile_mode':'verify',
              'maintenance_action':os.environ['MAINTENANCE_ACTION'], 'retention_plan_id':os.environ['PLAN_ID'],
              'rollback_publication_id':os.environ['TARGET_ID'],
              'rollback_expected_generation':os.environ['EXPECTED_GENERATION'],
              'rollback_reason':os.environ['ROLLBACK_REASON'], 'replay_id':os.environ['REPLAY_ID']}
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('EQ_JOB_PARAMETERS=' + json.dumps(parameters, separators=(',',':')) + '\n')
          PY
      - name: Run the existing serialized pipeline and final maintenance task
        run: python -m quake_pipeline.jobs
