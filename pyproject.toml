[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earthquake-watch"
version = "0.1.0"
description = "Earthquake Watch capture and bootstrap contracts"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
kafka = ["confluent-kafka>=2.5,<3"]

[project.scripts]
earthquake-watch = "earthquake_watch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
